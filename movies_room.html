<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Yessimkhan">
    <title>Movies Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a cinematic feel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.8); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.4); 
        }
        /* Modal open state body lock */
        body.modal-open {
            overflow: hidden;
        }
    </style>
</head>
<body class="text-white font-sans antialiased min-h-screen relative">

    <!-- Background Layers for Smooth Transitions -->
    <div class="fixed inset-0 z-[-10] bg-black"></div>
    <div id="bg-all" class="fixed inset-0 z-[-1] bg-gradient-to-b from-black to-[#0b004a] transition-opacity duration-1000 ease-in-out opacity-100 pointer-events-none"></div>
    <div id="bg-film" class="fixed inset-0 z-[-1] bg-gradient-to-b from-black to-[#6b2c00] transition-opacity duration-1000 ease-in-out opacity-0 pointer-events-none"></div>
    <div id="bg-series" class="fixed inset-0 z-[-1] bg-gradient-to-b from-black to-[#4a0000] transition-opacity duration-1000 ease-in-out opacity-0 pointer-events-none"></div>
    <div id="bg-doc" class="fixed inset-0 z-[-1] bg-gradient-to-b from-black to-[#003816] transition-opacity duration-1000 ease-in-out opacity-0 pointer-events-none"></div>
    <div id="bg-cartoon" class="fixed inset-0 z-[-1] bg-gradient-to-b from-black to-[#003340] transition-opacity duration-1000 ease-in-out opacity-0 pointer-events-none"></div>

    <header class="w-full bg-black/60 backdrop-blur-lg sticky top-0 z-40 border-b border-white/10 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center py-4 gap-4">
                <!-- Logo -->
                <div onclick="setFilter('all')" class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-orange-400 cursor-pointer hover:scale-105 transition-transform">
                    Movies
                </div>
                
                <!-- Navigation Filter Buttons -->
                <nav class="flex flex-wrap justify-center gap-2" id="filters">
                    <button onclick="setFilter('film')" data-type="film" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 border border-white/5 shadow-sm">
                        Фильм
                    </button>
                    <button onclick="setFilter('series')" data-type="series" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 border border-white/5 shadow-sm">
                        Сериал
                    </button>
                    <button onclick="setFilter('doc')" data-type="doc" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 border border-white/5 shadow-sm">
                        Деректі фильм
                    </button>
                    <button onclick="setFilter('cartoon')" data-type="cartoon" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 border border-white/5 shadow-sm">
                        Мултьфильм
                    </button>
                </nav>

                <!-- Add New Button -->
                <button onclick="openModal()" class="px-5 py-2 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white text-sm font-bold rounded-full shadow-lg hover:shadow-green-500/30 transition-all transform hover:-translate-y-0.5 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    Қосу
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 pb-20">
        <!-- Movie Grid -->
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-6 transition-all duration-500 opacity-100 scale-100">
            <!-- Cards will be injected by JavaScript -->
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-32 text-gray-400 flex flex-col items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
            </svg>
            <p class="text-xl font-medium">Бұл санатта әзірге ештеңе жоқ.</p>
            <p class="text-sm mt-2 opacity-70">Жаңа туынды қосу үшін жоғарыдағы батырманы басыңыз.</p>
        </div>
    </main>

    <!-- Add/Edit Movie Modal -->
    <div id="movie-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <!-- Modal Backdrop -->
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <!-- Modal Content -->
        <div class="bg-gray-900 border border-white/10 rounded-2xl shadow-2xl w-full max-w-md relative z-10 transform transition-all duration-300 scale-95 opacity-0" id="modal-content">
            <div class="p-6">
                <h2 id="modal-title" class="text-2xl font-bold text-white mb-6">Жаңа туынды қосу</h2>
                
                <form id="movie-form" onsubmit="saveMovie(event)" class="space-y-4">
                    <input type="hidden" id="movie-id">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Атауы</label>
                        <input type="text" id="movie-title" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors" placeholder="Мысалы: Forrest Gump">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Афиша суреті (URL)</label>
                        <input type="url" id="movie-img" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors" placeholder="https://...">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Видео сілтемесі (URL)</label>
                        <input type="url" id="movie-link" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors" placeholder="Трейлер немесе кино сілтемесі">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Шыққан жылы</label>
                            <input type="number" id="movie-year" required min="1900" max="2099" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors" placeholder="2024">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Санаты</label>
                            <select id="movie-type" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors">
                                <option value="film">Фильм</option>
                                <option value="series">Сериал</option>
                                <option value="doc">Деректі фильм</option>
                                <option value="cartoon">Мультфильм</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="pt-4 flex justify-end gap-3 border-t border-gray-800 mt-6">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-800 transition-colors font-medium">
                            Болдырмау
                        </button>
                        <button type="submit" class="px-6 py-2 bg-orange-600 hover:bg-orange-500 text-white rounded-lg transition-colors font-medium shadow-lg shadow-orange-600/20">
                            Сақтау
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal (Custom alert alternative) -->
    <div id="delete-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity" onclick="closeDeleteModal()"></div>
        <div class="bg-gray-900 border border-red-500/30 rounded-2xl shadow-2xl p-6 relative z-10 max-w-sm w-full text-center transform transition-all scale-95 opacity-0" id="delete-content">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100/10 mb-4">
                <svg class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 class="text-lg font-medium text-white mb-2">Туындыны өшіру</h3>
            <p class="text-sm text-gray-400 mb-6">Бұл фильмді тізімнен шынымен өшіргіңіз келе ме? Бұл әрекетті кері қайтару мүмкін емес.</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-lg transition-colors font-medium">Жоқ, қалдыру</button>
                <button id="confirm-delete-btn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg transition-colors font-medium">Иә, өшіру</button>
            </div>
        </div>
    </div>

    <script>
        // Initial Mock Data (Fallback if localStorage is empty)
        const initialMovies = [
            { id: 1, title: "Zoolander", type: "film", img: "https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcSc5eLi2JsjkhJPVnBl-8udd9S5n-Q4XUKyApArh9rfEZYuxFzT", link: "https://www.google.com/search?q=Zoolander", year: "2001" },
            { id: 2, title: "The Landman", type: "series", img: "https://s1.stc.all.kpcdn.net/putevoditel/serialy/wp-content/uploads/2025/10/result_w1500_55512130-467x697.jpg", link: "https://www.google.com/search?q=The+Landman", year: "2024" },
            { id: 3, title: "Lie To Me", type: "series", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkWCIWAt4MDT0dLT5l3DqaW2lV0KOcEwDgNTzxgyJyueyBdpV6qjV1ptBNTnDLg7TJnI4n&s=10", link: "https://www.google.com/search?q=Lie+to+Me", year: "2009" },
            { id: 4, title: "Young Sheldon", type: "series", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtusiEAM62bwLPDUmm8Iyc5WnV1u3nTvSxQ82KqzSlPwQOexMH98rAYQquHbouvoR4JkDQ76AcUJidENpd81NZnB4zZ9PufXSJ1r8w8vg&s=10", link: "https://www.google.com/search?q=Young+Sheldon", year: "2017" },
            { id: 5, title: "Green Book", type: "film", img: "https://thumbs.dfs.ivi.ru/storage0/contents/f/7/fb126d154d48e1a250305a329ac212.jpg", link: "https://www.google.com/search?q=Green+Book", year: "2018" },
            { id: 6, title: "Forrest Gump", type: "film", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMIEluqxI4xC_pHQuyZba_xDHZfmyGjIk2eA&s", link: "https://www.google.com/search?q=Forrest+Gump", year: "1994" }
        ];

        let movies = [];
        let currentFilter = 'all';
        let itemToDeleteId = null;

        // Load data from localStorage or use initial mock data
        function loadData() {
            const stored = localStorage.getItem('moviesRoomData');
            if (stored) {
                movies = JSON.parse(stored);
            } else {
                movies = [...initialMovies];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('moviesRoomData', JSON.stringify(movies));
        }

        function renderMovies() {
            const grid = document.getElementById('movie-grid');
            const emptyState = document.getElementById('empty-state');
            
            // Filter logic
            const filteredMovies = currentFilter === 'all' 
                ? movies 
                : movies.filter(m => m.type === currentFilter);

            // Hide for animation
            grid.classList.remove('opacity-100', 'scale-100');
            grid.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                grid.innerHTML = '';

                if (filteredMovies.length === 0) {
                    grid.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                } else {
                    grid.classList.remove('hidden');
                    emptyState.classList.add('hidden');

                    // Generate cards
                    filteredMovies.reverse().forEach(movie => {
                        const card = document.createElement('div');
                        card.className = "relative overflow-hidden rounded-xl aspect-[2/3] group shadow-lg border border-white/10 bg-gray-900";
                        
                        card.innerHTML = `
                            <img src="${movie.img}" alt="${movie.title}" onerror="this.src='https://placehold.co/400x600/222/FFF?text=Image+Not+Found'" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700 ease-out">
                            
                            <!-- Hover Overlay -->
                            <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/80 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300 flex flex-col justify-end p-4 z-10">
                                
                                <div class="transform translate-y-8 group-hover:translate-y-0 transition-transform duration-300">
                                    <h3 class="text-white font-bold text-lg leading-tight mb-1 truncate">${movie.title}</h3>
                                    <span class="block text-orange-400 font-medium text-sm mb-4">${movie.year}</span>
                                    
                                    <div class="flex flex-col gap-2">
                                        <a href="${movie.link}" target="_blank" class="w-full py-2 bg-white text-black font-bold text-sm rounded-lg hover:bg-gray-200 transition-colors flex justify-center items-center gap-1">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                                            Көру
                                        </a>
                                        
                                        <div class="flex gap-2">
                                            <button onclick="editMovie(${movie.id})" class="flex-1 py-1.5 bg-blue-600/80 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition-colors backdrop-blur-sm">Өңдеу</button>
                                            <button onclick="promptDelete(${movie.id})" class="flex-1 py-1.5 bg-red-600/80 hover:bg-red-500 text-white text-xs font-medium rounded-lg transition-colors backdrop-blur-sm">Өшіру</button>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }

                // Show grid
                setTimeout(() => {
                    grid.classList.remove('opacity-0', 'scale-95');
                    grid.classList.add('opacity-100', 'scale-100');
                }, 50);

            }, 300);
        }

        function updateBackground(type) {
            const layers = ['all', 'film', 'series', 'doc', 'cartoon'];
            layers.forEach(layer => {
                const el = document.getElementById(`bg-${layer}`);
                if (el) {
                    if (layer === type) {
                        el.classList.replace('opacity-0', 'opacity-100');
                    } else {
                        el.classList.replace('opacity-100', 'opacity-0');
                    }
                }
            });
        }

        function updateButtons(type) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.dataset.type === type) {
                    btn.classList.add('bg-white/30', 'text-white', 'border-white/50');
                    btn.classList.remove('bg-white/10', 'border-white/5');
                } else {
                    btn.classList.remove('bg-white/30', 'text-white', 'border-white/50');
                    btn.classList.add('bg-white/10', 'border-white/5');
                }
            });
        }

        function setFilter(type) {
            if (currentFilter === type) return;
            currentFilter = type;
            updateButtons(type);
            updateBackground(type);
            renderMovies();
        }

        // Form & Modal handling
        const modal = document.getElementById('movie-modal');
        const modalContent = document.getElementById('modal-content');
        const form = document.getElementById('movie-form');

        function openModal() {
            modal.classList.remove('hidden');
            document.body.classList.add('modal-open');
            // Small delay for transition to work
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
            
            // If ID is empty, we are adding new
            if(!document.getElementById('movie-id').value) {
                document.getElementById('modal-title').innerText = "Жаңа туынды қосу";
                document.getElementById('movie-type').value = currentFilter === 'all' ? 'film' : currentFilter;
            }
        }

        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.classList.remove('modal-open');
                form.reset();
                document.getElementById('movie-id').value = ''; // clear id
            }, 300);
        }

        function saveMovie(e) {
            e.preventDefault();
            
            const idVal = document.getElementById('movie-id').value;
            const title = document.getElementById('movie-title').value.trim();
            const img = document.getElementById('movie-img').value.trim();
            const link = document.getElementById('movie-link').value.trim();
            const year = document.getElementById('movie-year').value;
            const type = document.getElementById('movie-type').value;

            if (idVal) {
                // Edit existing
                const index = movies.findIndex(m => m.id == idVal);
                if(index > -1) {
                    movies[index] = { id: Number(idVal), title, type, img, link, year };
                }
            } else {
                // Add new
                const newId = Date.now();
                movies.push({ id: newId, title, type, img, link, year });
            }

            saveToLocalStorage();
            closeModal();
            renderMovies();
        }

        function editMovie(id) {
            const movie = movies.find(m => m.id === id);
            if (!movie) return;

            document.getElementById('modal-title').innerText = "Туындыны өңдеу";
            document.getElementById('movie-id').value = movie.id;
            document.getElementById('movie-title').value = movie.title;
            document.getElementById('movie-img').value = movie.img;
            document.getElementById('movie-link').value = movie.link;
            document.getElementById('movie-year').value = movie.year;
            document.getElementById('movie-type').value = movie.type;

            openModal();
        }

        const delModal = document.getElementById('delete-modal');
        const delContent = document.getElementById('delete-content');
        
        function promptDelete(id) {
            itemToDeleteId = id;
            delModal.classList.remove('hidden');
            document.body.classList.add('modal-open');
            setTimeout(() => {
                delContent.classList.remove('scale-95', 'opacity-0');
                delContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeDeleteModal() {
            delContent.classList.remove('scale-100', 'opacity-100');
            delContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                delModal.classList.add('hidden');
                document.body.classList.remove('modal-open');
                itemToDeleteId = null;
            }, 300);
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', () => {
            if (itemToDeleteId) {
                movies = movies.filter(m => m.id !== itemToDeleteId);
                saveToLocalStorage();
                renderMovies();
            }
            closeDeleteModal();
        });

        // Initialize App
        window.onload = () => {
            loadData();
            renderMovies();
        };
    </script>
</body>
</html>
